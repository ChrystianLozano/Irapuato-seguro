# Workflow para actualizar automáticamente el archivo de datos delictivos cada mes.
name: Automated Monthly Crime Data Update

on:
  schedule:
    # Se ejecuta a las 00:00 UTC el primer día de cada mes
    - cron: "0 0 1 * *"

  # Permite disparar la ejecución manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

permissions:
  contents: write # Permite realizar commits y push de vuelta al repositorio

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Configurar Python en el contenedor
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Correr el script de actualización
      - name: Run update script
        run: |
          python scripts/update_crime_data.py

      # 4. Commit y Push de los cambios si el archivo JSON se modificó
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Verificar si hay cambios en el archivo de base de datos
          git add data/database.json
          
          if git diff --cached --quiet; then
            echo "No se generaron nuevos datos delictivos para este periodo. Base de datos al día."
          else
            git commit -m "data: actualización automática mensual de incidencia delictiva [skip ci]"
            git push
            echo "Cambios subidos y desplegados con éxito."
          fi
