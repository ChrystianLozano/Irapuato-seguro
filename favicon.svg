<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64">
  <defs>
    <!-- Gradiente azul a índigo para el escudo -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Sombra para el resplandor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fondo transparente y Escudo -->
  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="url(#shieldGrad)" />
  <!-- Marca interior del escudo en blanco brillante -->
  <path d="M12 5v14c4.5-2.5 6.5-6.5 6.5-10V6.5L12 5z" fill="#ffffff" opacity="0.15" />
  <!-- Icono de check de seguridad interior -->
  <path d="M10 15.5l-3-3 1.4-1.4 1.6 1.6 4.6-4.6 1.4 1.4-6 6z" fill="#ffffff" filter="url(#glow)" />
</svg>
